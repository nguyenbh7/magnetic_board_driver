name: HDMM sticker app import smoke tests
on:
  push:
    branches: [feature/live-rigid-body-fit]
    paths:
      - 'app/src/hdmm_sticker.rs'
      - 'app/src/main.rs'
      - 'app/src/hdmm_ct_workflow.rs'
      - 'app/src/rigid_fit.rs'
      - 'app/src/cbct_geometry.rs'
      - 'app/python_cbct/hdmm_anatomy_first.py'
      - 'app/python_cbct/approve_anatomy_hdmm_sticker.py'
      - 'app/python_cbct/hdmm_sticker_geometry.py'
      - '.github/workflows/hdmm-sticker-app.yml'
  workflow_dispatch:

jobs:
  windows-rust-app:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Compile and test the entire live application (includes HDMM CT workflow)
        run: cargo test -p app
      - name: Verify full app Rust types
        run: cargo check -p app
